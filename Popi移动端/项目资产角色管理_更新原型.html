<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>POPi 移动端｜项目·资产·角色管理</title>
<style>
:root{--purple:#7047ff;--purple-soft:#f4efff;--ink:#17161b;--muted:#96929b;--line:#ece9ef;--bg:#fff;--danger:#e34f61}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f1eff5;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{width:min(100vw,444px);height:min(100vh,960px);min-height:760px;margin:auto;background:#fff;overflow:hidden;position:relative;box-shadow:0 24px 80px rgba(30,24,50,.12)}
.status{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:15px;font-weight:850;background:#fff}.status-icons{display:flex;align-items:center;gap:7px}.signal{display:flex;align-items:end;gap:2px;height:14px}.signal i{width:3px;border-radius:2px;background:#111}.signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:8px}.signal i:nth-child(3){height:11px}.signal i:nth-child(4){height:14px}.wifi{font-size:17px}.battery{width:26px;height:13px;border:2px solid #111;border-radius:4px;position:relative}.battery:before{content:"";position:absolute;inset:2px;background:#111;border-radius:1px}.battery:after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:5px;background:#111;border-radius:0 2px 2px 0}
.content{height:calc(100% - 48px);overflow:auto;padding-bottom:82px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.top{padding:19px 24px 0}.topline{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;margin-bottom:15px}.back{border:0;background:transparent;font-size:28px;color:#343139;padding:0;text-align:left}.top-title{text-align:center;font-size:16px;font-weight:900}.top-action{border:0;background:transparent;color:#85818a;font-size:13px;padding:0;text-align:right}.tabs{display:flex;align-items:center;gap:28px;padding:0 8px 17px}.tab{border:0;background:transparent;color:#aaa6ad;font-size:20px;font-weight:900;padding:3px 0;white-space:nowrap}.tab.active{color:var(--ink)}.filters{display:flex;gap:10px;overflow:auto;padding:0 5px 18px;scrollbar-width:none}.filter{border:0;background:transparent;color:#918d95;font-size:14px;padding:10px 14px;border-radius:999px;white-space:nowrap}.filter.active{background:#f4f3f5;color:#17161b;font-weight:800}
.project-list{display:grid;gap:13px;padding:0 5px}.project{display:grid;grid-template-columns:66px 1fr auto;gap:13px;align-items:center;border:0;background:#fff;padding:7px 0;text-align:left}.project-cover{height:66px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:900;position:relative;overflow:hidden}.project-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(0,0,0,.08))}.g1{background:linear-gradient(145deg,#d8d4ff,#8067d7)}.g2{background:linear-gradient(145deg,#f2c7af,#a55f56)}.g3{background:linear-gradient(145deg,#c4e6ff,#4679a8)}.project-copy{min-width:0}.eyebrow{font-size:11px;color:#99959d;margin-bottom:5px}.project-name{display:block;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-status{font-size:12px;color:var(--purple);font-weight:750;margin-top:7px}.project-date{font-size:11px;color:#aaa6ae;align-self:start;padding-top:6px}.new-project{width:100%;border:1px dashed #d9d5df;background:#faf9fb;color:#6f6a75;border-radius:16px;padding:14px;margin-top:18px;font-size:13px;font-weight:800}.bottom{position:absolute;left:0;right:0;bottom:0;height:74px;background:rgba(255,255,255,.96);border-top:1px solid #efedf1;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 12px 6px;backdrop-filter:blur(14px)}.bottom button{border:0;background:transparent;display:grid;justify-items:center;align-content:center;gap:3px;color:#918d96;font-size:11px}.bottom b{width:30px;height:30px;border:2px solid currentColor;border-radius:10px;display:grid;place-items:center;font-size:13px}.bottom .active{color:#17161b;font-weight:900}.bottom .active b{background:#17161b;color:#fff;border-color:#17161b}
.detail{padding:0 24px}.hero{height:260px;border-radius:24px;display:grid;place-items:center;color:#fff;font-size:72px;font-weight:950;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 25%,rgba(255,255,255,.3),transparent 27%),linear-gradient(transparent 55%,rgba(20,15,30,.3))}.badge{position:absolute;left:16px;bottom:15px;z-index:2;background:rgba(22,20,27,.7);color:#fff;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800}.detail h1{font-size:24px;line-height:1.3;margin:18px 0 5px}.sub{font-size:12px;color:#8c8891;line-height:1.6}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.action-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left}.action-card b{font-size:14px;display:block}.action-card span{font-size:11px;color:#928e97;display:block;margin-top:6px;line-height:1.45}.section-title{font-size:14px;font-weight:900;margin:22px 0 10px}.progress{display:grid;gap:8px}.progress-row{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;background:#f7f6f8;border-radius:14px;padding:11px;font-size:13px}.progress-row i{width:28px;height:28px;border-radius:9px;background:#eee8ff;color:var(--purple);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900}.progress-row small{font-size:10px;color:#918d96}.primary{width:100%;border:0;border-radius:999px;background:#111;color:#fff;padding:15px;font-size:15px;font-weight:900;margin-top:13px}.secondary{width:100%;border:1px solid var(--line);border-radius:999px;background:#fff;color:#2a2730;padding:14px;font-size:14px;font-weight:850;margin-top:9px}
.media-head{display:flex;justify-content:space-between;align-items:center;padding:0 5px 12px}.select{border:0;background:transparent;color:#85818a;font-size:13px}.media-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 5px}.media{border:0;background:#fff;padding:0;text-align:left;border-radius:17px;overflow:hidden;box-shadow:0 0 0 1px #eae7ed}.media.selected{box-shadow:inset 0 0 0 2px var(--purple)}.media-art{height:160px;display:grid;place-items:center;color:#fff;font-size:42px;font-weight:950;position:relative}.media-art em{position:absolute;right:9px;bottom:9px;background:rgba(20,18,25,.65);border-radius:7px;padding:4px 7px;font-size:10px;font-style:normal}.media-check{position:absolute;right:9px;top:9px;width:24px;height:24px;border:2px solid #fff;border-radius:50%;background:rgba(30,28,35,.25);display:grid;place-items:center;font-size:12px}.media-copy{padding:12px}.media-copy b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media-copy span{display:block;font-size:10px;color:#928e98;line-height:1.5;margin-top:5px}.note{display:flex;gap:9px;background:#f5f0ff;border:1px solid #e7ddff;border-radius:14px;padding:12px;margin:16px 5px 0;color:#5b526b}.note b{font-size:11px;color:var(--purple);white-space:nowrap}.note span{font-size:10px;line-height:1.55}
.empty{min-height:590px;display:grid;place-content:center;justify-items:center;text-align:center;padding:0 30px}.role-art{width:275px;height:190px;position:relative;margin-bottom:24px}.role-art i{position:absolute;width:116px;height:166px;border-radius:22px;display:grid;place-items:center;color:#fff;font-size:46px;font-style:normal;font-weight:950;box-shadow:0 14px 35px rgba(40,30,70,.12)}.role-art i:nth-child(1){left:5px;top:14px;transform:rotate(-7deg);background:linear-gradient(145deg,#cbd9f7,#7791c2)}.role-art i:nth-child(2){left:80px;top:0;z-index:2;background:linear-gradient(145deg,#f1d9e3,#bd8da2)}.role-art i:nth-child(3){right:5px;top:14px;transform:rotate(7deg);background:linear-gradient(145deg,#eadbc7,#b69e7e)}.empty h2{font-size:25px;margin:0 0 10px}.empty p{font-size:14px;color:#84808a;line-height:1.65;margin:0 0 20px}.empty .primary{width:auto;padding-left:35px;padding-right:35px}.role-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 5px}.role-card{border:0;background:#fff;border-radius:18px;overflow:hidden;text-align:left;box-shadow:0 0 0 1px #ebe8ee}.role-face{height:192px;display:grid;place-items:center;color:#fff;font-size:64px;font-weight:950;position:relative;background:linear-gradient(145deg,#efdfe6,#b68d9c)}.role-face span{position:absolute;left:10px;bottom:10px;background:rgba(20,18,24,.62);border-radius:999px;padding:5px 8px;font-size:10px}.role-card-copy{padding:12px}.role-card-copy b{font-size:15px}.role-card-copy small{display:block;color:#928e98;font-size:10px;margin-top:6px}
.dark{background:#08090c;color:#fff;height:100%}.dark .status{background:#08090c;color:#fff}.dark .signal i,.dark .battery:before,.dark .battery:after{background:#fff}.dark .battery{border-color:#fff}.dark .content{height:calc(100% - 48px);padding-bottom:24px}.dark .top{padding-top:7px}.dark .back{width:38px;height:38px;border-radius:50%;background:#5a5b60;color:#fff;font-size:21px;text-align:center}.method-hero{height:330px;margin:8px 55px 18px;border-radius:28px;background:radial-gradient(circle at 63% 24%,#d9b28b,transparent 22%),linear-gradient(145deg,#493640,#b08062 58%,#29282e);display:grid;place-items:center;color:#fff;font-size:78px;font-weight:950;box-shadow:0 18px 50px rgba(0,0,0,.38)}.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 24px}.method{border:1px solid #292a2f;background:#1f2024;color:#fff;border-radius:18px;padding:17px;text-align:left;min-height:104px}.method.wide{grid-column:span 2;background:#fff;color:#17161b}.method.active{border-color:#886bff;box-shadow:inset 0 0 0 1px #886bff}.method b{font-size:15px;display:block}.method span{display:block;color:#98989f;font-size:11px;line-height:1.5;margin-top:8px}.consent{margin:16px 24px 4px;border:0;background:transparent;color:#aaa8b0;text-align:left;font-size:11px;display:flex;gap:9px;align-items:center}.consent i{width:20px;height:20px;border:1px solid #6b6c72;border-radius:6px;display:grid;place-items:center;font-style:normal}.consent.checked i{background:var(--purple);border-color:var(--purple);color:#fff}.dark .primary{width:calc(100% - 48px);margin-left:24px;background:#fff;color:#17161b}.dark .primary:disabled{background:#25262b;color:#65666d}
.form{padding:0 24px}.preview{height:300px;width:240px;margin:2px auto 25px;border-radius:24px;background:linear-gradient(150deg,#f0dce4,#b88e9e);display:grid;place-items:center;color:#fff;font-size:84px;font-weight:950;position:relative}.preview span{position:absolute;right:12px;bottom:12px;background:rgba(20,18,24,.56);border-radius:12px;padding:8px 11px;font-size:11px}.field{display:block;color:#8f8b94;font-size:13px;font-weight:800;margin:16px 0}.field input,.field textarea{width:100%;border:0;background:#f5f4f6;border-radius:16px;padding:16px;font-size:15px;margin-top:8px;outline:none}.field textarea{height:78px;resize:none}.help{font-size:11px;color:#aaa6ae;margin-top:-9px}.visibility{background:#f5f4f6;border-radius:17px;overflow:hidden}.visibility button{width:100%;border:0;background:transparent;text-align:left;padding:15px;display:flex;align-items:center;gap:9px;font-size:15px}.visibility button+button{border-top:1px solid #e7e4e9}.visibility span{margin-left:auto;color:var(--purple);font-weight:900}.privacy{font-size:11px;color:#9b97a0;line-height:1.55;margin:10px 2px}.receipt{min-height:720px;display:grid;place-content:center;text-align:center;justify-items:center;padding:30px}.check{width:80px;height:80px;border-radius:28px;background:#ebf9f2;color:#1aa66a;display:grid;place-items:center;font-size:36px;margin-bottom:20px}.receipt h2{font-size:25px;margin:0 0 10px}.receipt p{font-size:14px;color:#84808a;line-height:1.65;margin:0 0 20px}
@media(max-width:380px){.tabs{gap:20px}.tab{font-size:18px}.method-hero{height:290px}.media-art{height:145px}}
</style>
</head>
<body><div id="app" class="app"></div>
<script>
const params=new URLSearchParams(location.search);
const state={screen:params.get('screen')||'projects',projectFilter:'全部',mediaFilter:'全部',selectMode:false,selected:[],projectName:'毕业以后，才发现自己喜欢过他',method:null,consent:false,roleName:'',visibility:'仅自己',roles:[]};
const projects=[{id:'p1',type:'全能创作 Agent',name:'毕业以后，才发现自己喜欢过他',status:'信息待确认',date:'今天 10:42',grad:'g1',mark:'✦'},{id:'p2',type:'沉浸式短片',name:'旧教室里的最后一张合照',status:'制作中',date:'昨天 18:20',grad:'g2',mark:'映'},{id:'p3',type:'短剧创作',name:'毕业纪念册从纸箱滑落',status:'已完成',date:'8 月 28 日',grad:'g3',mark:'剧'}];
const media=[{id:'m1',name:'毕业季粗剪 v1',type:'视频',project:'毕业以后，才发现自己喜欢过他',date:'今天 10:36',duration:'00:32',grad:'g1',mark:'▶'},{id:'m2',name:'镜头 03 · 关键帧',type:'图片',project:'旧教室里的最后一张合照',date:'昨天 19:06',duration:'2K',grad:'g2',mark:'03'},{id:'m3',name:'发布封面 v2',type:'图片',project:'毕业纪念册从纸箱滑落',date:'8 月 28 日',duration:'4:5',grad:'g3',mark:'封'},{id:'m4',name:'旧教室环境图',type:'图片',project:'旧教室里的最后一张合照',date:'8 月 27 日',duration:'2K',grad:'g1',mark:'景'}];
function status(dark=false){return `<div class='status'><span>9:41</span><span class='status-icons'><span class='signal'><i></i><i></i><i></i><i></i></span><span class='wifi'>⌁</span><span class='battery'></span></span></div>`}
function tabs(active){return `<div class='tabs'>${[['projects','创作历史'],['assets','资产库'],['roles','角色库']].map(t=>`<button class='tab ${active===t[0]?'active':''}' data-action='tab:${t[0]}'>${t[1]}</button>`).join('')}</div>`}
function bottom(){return `<div class='bottom'><button data-action='home'><b>✦</b><span>创作</span></button><button><b>◒</b><span>灵感</span></button><button><b>▣</b><span>剧场</span></button><button class='active'><b>＝</b><span>资产</span></button></div>`}
function shell(active,body){return `${status()}<div class='content'><div class='top'><div class='topline'><button class='back' data-action='home'>‹</button><span></span><span></span></div>${tabs(active)}${body}</div></div>${bottom()}`}
function projectPage(){const fs=['全部','全能创作 Agent','沉浸式短片','短剧创作'],list=projects.filter(p=>state.projectFilter==='全部'||p.type===state.projectFilter);return shell('projects',`<div class='filters'>${fs.map(f=>`<button class='filter ${state.projectFilter===f?'active':''}' data-action='project-filter:${f}'>${f}</button>`).join('')}</div><div class='project-list'>${list.map(p=>`<button class='project' data-action='project-open:${p.id}'><span class='project-cover ${p.grad}'>${p.mark}</span><span class='project-copy'><span class='eyebrow'>${p.type}</span><span class='project-name'>${p.id==='p1'?state.projectName:p.name}</span><span class='project-status'>ⓘ ${p.status}</span></span><span class='project-date'>${p.date}</span></button>`).join('')}</div><button class='new-project' data-action='new-project'>＋ 开始一个新的内容项目</button>`)}
function projectDetail(){return `${status()}<div class='content'><div class='top'><div class='topline'><button class='back' data-action='screen:projects'>‹</button><span class='top-title'>项目详情</span><button class='top-action' data-action='archive'>归档</button></div></div><div class='detail'><div class='hero g1'>✦<span class='badge'>信息待确认</span></div><h1>${state.projectName}</h1><div class='sub'>全能创作 Agent · 视频创作 · 更新于今天 10:42</div><div class='action-grid'><button class='action-card' data-action='continue'><b>继续创作</b><span>回到 Content Brief 确认</span></button><button class='action-card' data-action='rename'><b>重命名</b><span>只修改项目名称</span></button><button class='action-card' data-action='duplicate'><b>复制项目</b><span>复用 Brief 与角色</span></button><button class='action-card' data-action='screen:assets'><b>查看资产</b><span>6 个项目产物</span></button></div><div class='section-title'>项目进度</div><div class='progress'><div class='progress-row'><i>1</i><span>内容简报</span><small>待确认</small></div><div class='progress-row'><i>2</i><span>角色与资产绑定</span><small>2 个角色 · 6 个资产</small></div><div class='progress-row'><i>3</i><span>下一节点</span><small>生成脚本</small></div></div></div></div>`}
function renamePage(){return `${status()}<div class='content'><div class='top'><div class='topline'><button class='back' data-action='screen:project-detail'>‹</button><span class='top-title'>重命名项目</span><span></span></div></div><div class='detail'><label class='field'>项目名称<input id='projectName' maxlength='40' value='${state.projectName}'></label><div class='note'><b>项目管理</b><span>重命名不会改变 Project ID、版本关系或已经生成的资产。</span></div><button class='primary' data-action='save-project-name'>保存名称</button></div></div>`}
function archivePage(){return `${status()}<div class='content'><div class='top'><div class='topline'><button class='back' data-action='screen:project-detail'>‹</button><span class='top-title'>归档项目</span><span></span></div></div><div class='receipt'><div class='check' style='background:#fff1eb;color:#d87740'>!</div><h2>归档这个项目？</h2><p>项目会从默认列表隐藏，但脚本、角色绑定、资产版本与发布记录都会保留，并可随时恢复。</p><button class='primary' data-action='archive-confirm'>确认归档</button><button class='secondary' data-action='screen:project-detail'>取消</button></div></div>`}
function assetsPage(){const fs=['全部','视频','图片'],list=media.filter(m=>state.mediaFilter==='全部'||m.type===state.mediaFilter);return shell('assets',`<div class='media-head'><div class='filters' style='padding:0'>${fs.map(f=>`<button class='filter ${state.mediaFilter===f?'active':''}' data-action='media-filter:${f}'>${f}</button>`).join('')}</div><button class='select' data-action='select-mode'>${state.selectMode?'完成':'▢ 选择'}</button></div><div class='media-grid'>${list.map(m=>`<button class='media ${state.selected.includes(m.id)?'selected':''}' data-action='media:${m.id}'>${state.selectMode?`<span class='media-check'>${state.selected.includes(m.id)?'✓':''}</span>`:''}<span class='media-art ${m.grad}'>${m.mark}<em>${m.duration}</em></span><span class='media-copy'><b>${m.name}</b><span>${m.project}<br>${m.date}</span></span></button>`).join('')}</div><div class='note'><b>自动沉淀</b><span>项目生成的视频和图片会自动进入资产库，并保留来源项目、生成时间与版本。</span></div>`)}
function rolesPage(){return shell('roles',state.roles.length?`<div class='role-list'>${state.roles.map(r=>`<button class='role-card' data-action='role-detail'><span class='role-face'>${r.name[0]}<span>${r.visibility}</span></span><span class='role-card-copy'><b>${r.name}</b><small>${r.method} · v1.0</small></span></button>`).join('')}</div><button class='new-project' data-action='role-start'>＋ 创建新角色</button>`:`<div class='empty'><div class='role-art'><i>陈</i><i>夏</i><i>闪</i></div><h2>建立长期可复用的角色</h2><p>通过录制、上传照片或输入提示词创建角色，并在不同项目中保持一致。</p><button class='primary' data-action='role-start'>开始创建</button></div>`)}
function methodPage(){return `<div class='dark'>${status(true)}<div class='content'><div class='top'><div class='topline'><button class='back' data-action='screen:roles'>‹</button><span class='top-title'>选择创建方式</span><span></span></div></div><div class='method-hero'>人</div><div class='methods'><button class='method wide ${state.method==='录制真人形象'?'active':''}' data-action='method:录制真人形象'><b>录制真人形象</b><span>录制约 10 秒，将本人外形和声音添加到视频中</span></button><button class='method ${state.method==='上传角色图'?'active':''}' data-action='method:上传角色图'><b>上传角色图</b><span>支持真人、插画或虚拟角色参考图</span></button><button class='method ${state.method==='AI 生成角色'?'active':''}' data-action='method:AI 生成角色'><b>AI 生成角色</b><span>输入描述，结合账号风格生成</span></button></div><button class='consent ${state.consent?'checked':''}' data-action='consent'><i>${state.consent?'✓':''}</i><span>我已获得形象素材授权，并同意《POPi 角色使用规范》</span></button><button class='primary' data-action='method-next' ${!state.method||!state.consent?'disabled':''}>继续创建</button></div></div>`}
function roleForm(){return `${status()}<div class='content'><div class='top'><div class='topline'><button class='top-action' data-action='screen:role-method'>取消</button><span class='top-title'>创建角色</span><span></span></div></div><div class='form'><div class='preview'>${state.roleName?state.roleName[0]:'新'}<span>↻ 替换</span></div><label class='field'>角色名称<input id='roleName' maxlength='10' value='${state.roleName}' placeholder='10 个字符以内'></label><div class='help'>不包括 @ ( ) / 等无效字符</div>${state.method==='AI 生成角色'?`<label class='field'>角色描述<textarea id='rolePrompt' placeholder='例如：20 岁校园女生，黑色长发，克制安静'></textarea></label>`:''}<label class='field'>角色可见范围</label><div class='visibility'><button data-action='visibility:仅自己'>♙　仅我自己 <span>${state.visibility==='仅自己'?'✓':''}</span></button><button data-action='visibility:所有人'>♧　所有人 <span>${state.visibility==='所有人'?'✓':''}</span></button></div><div class='privacy'>公开后角色形象可能被他人引用并生成内容；历史项目仍保留创建时的角色版本与可见范围快照。</div><button class='primary' data-action='create-role'>创建角色</button></div></div>`}
function roleSuccess(){return `${status()}<div class='content'><div class='receipt'><div class='check'>✓</div><h2>角色创建完成</h2><p>角色已进入账号角色库，可在项目创建、脚本资产计划和素材选择器中复用。</p><button class='primary' data-action='screen:roles'>返回角色库</button></div></div>`}
function roleDetail(){const r=state.roles[0]||{name:'闪闪',method:'上传角色图',visibility:'仅自己'};return `${status()}<div class='content'><div class='top'><div class='topline'><button class='back' data-action='screen:roles'>‹</button><span class='top-title'>角色详情</span><button class='top-action'>编辑</button></div></div><div class='detail'><div class='hero' style='background:linear-gradient(145deg,#efdfe6,#b68d9c)'>${r.name[0]}</div><h1>${r.name}</h1><div class='sub'>${r.method} · ${r.visibility} · 角色版本 v1.0</div><div class='note'><b>版本复用</b><span>新项目引用当前版本；历史项目继续指向创建时的角色版本，不会被后续编辑覆盖。</span></div><button class='primary' data-action='new-project'>用于新项目</button><button class='secondary' data-action='screen:roles'>返回角色库</button></div></div>`}
function render(){const pages={projects:projectPage,'project-detail':projectDetail,rename:renamePage,archive:archivePage,assets:assetsPage,roles:rolesPage,'role-method':methodPage,'role-form':roleForm,'role-success':roleSuccess,'role-detail':roleDetail},root=document.getElementById('app');root.className='app '+(['projects','assets','roles'].includes(state.screen)?'with-bottom':'');root.innerHTML=(pages[state.screen]||projectPage)()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a.startsWith('screen:'))state.screen=a.slice(7);else if(a.startsWith('tab:'))state.screen=a.slice(4);else if(a.startsWith('project-filter:'))state.projectFilter=a.slice(15);else if(a.startsWith('project-open:'))state.screen='project-detail';else if(a==='rename')state.screen='rename';else if(a==='save-project-name'){state.projectName=document.getElementById('projectName').value.trim()||state.projectName;state.screen='project-detail'}else if(a==='archive')state.screen='archive';else if(a==='archive-confirm')state.screen='projects';else if(a==='continue'||a==='new-project'||a==='home')alert('已返回 POPi 创作入口');else if(a==='duplicate')alert('已复制项目草稿，并保留角色与资产引用');else if(a.startsWith('media-filter:'))state.mediaFilter=a.slice(13);else if(a==='select-mode'){state.selectMode=!state.selectMode;if(!state.selectMode)state.selected=[]}else if(a.startsWith('media:')){const id=a.slice(6);if(state.selectMode)state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];else alert('打开资产详情：保留来源项目和版本关系')}else if(a==='role-start'){state.screen='role-method';state.method=null;state.consent=false}else if(a.startsWith('method:'))state.method=a.slice(7);else if(a==='consent')state.consent=!state.consent;else if(a==='method-next'&&state.method&&state.consent)state.screen='role-form';else if(a.startsWith('visibility:'))state.visibility=a.slice(11);else if(a==='create-role'){const name=(document.getElementById('roleName')?.value||state.roleName).trim();if(!name)return alert('请输入角色名称');if(/[@()\/]/.test(name))return alert('角色名称包含无效字符');state.roleName=name;state.roles=[{name,method:state.method,visibility:state.visibility}];state.screen='role-success'}else if(a==='role-detail')state.screen='role-detail';render()});
document.addEventListener('input',e=>{if(e.target.id==='roleName')state.roleName=e.target.value});
if(state.screen==='role-method'){state.method='上传角色图';state.consent=true}if(state.screen==='role-form'){state.method='上传角色图';state.consent=true;state.roleName='闪闪'}render();
</script></body></html>
