name: popi_ai_app
description: A Flutter starter template with Riverpod, go_router, Dio, localization and theme switching.
publish_to: "none"
version: 1.0.0+1902

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  dio: ^5.8.0+1
  extended_text_field: ^17.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  go_router: ^14.8.1
  image_picker: ^1.2.1
  shared_preferences: ^2.5.3
  toastification: ^3.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
