name: popi_ai_app
description: A Flutter starter template with Riverpod, go_router, Dio, localization and theme switching.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  flutter_chat_core: ^2.9.0
  flutter_chat_types: ^3.6.2
  flutter_chat_ui: ^2.11.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.3
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
