<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>登录 POPi 测试环境</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #303038; background: #f7f6ff; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
    main { width: min(100%, 390px); padding: 34px 28px 30px; border: 1px solid rgba(112, 77, 255, .10); border-radius: 30px; background: #fff; box-shadow: 0 24px 70px rgba(66, 47, 122, .12); }
    .mark { width: 58px; height: 42px; margin: 0 auto 22px; border-radius: 999px; background: linear-gradient(135deg, #8664ff, #5e35ef); display: grid; place-items: center; color: #fff; font-weight: 800; letter-spacing: -.04em; }
    h1 { margin: 0; text-align: center; font-size: 26px; letter-spacing: -.03em; }
    .hint { margin: 10px 0 26px; text-align: center; color: #797782; font-size: 15px; line-height: 1.5; }
    label { display: block; margin: 17px 4px 8px; font-size: 14px; font-weight: 650; }
    input { width: 100%; min-height: 52px; border: 1px solid #e7e3f5; border-radius: 18px; padding: 0 17px; background: #faf9ff; color: #29272f; font: inherit; outline: none; }
    input:focus { border-color: #7247ff; box-shadow: 0 0 0 4px rgba(114, 71, 255, .12); }
    .password-field { position: relative; }
    .password-field input { padding-right: 78px; }
    .password-toggle { position: absolute; top: 5px; right: 6px; width: auto; min-width: 62px; min-height: 42px; margin: 0; padding: 0 12px; border: 0; border-radius: 999px; background: #efecfa; color: #554d67; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    .password-help { margin: 8px 4px 0; color: #85818d; font-size: 13px; line-height: 1.4; }
    .submit { width: 100%; min-height: 52px; margin-top: 24px; border: 0; border-radius: 999px; background: linear-gradient(135deg, #7d55ff, #6438f3); color: #fff; font: inherit; font-weight: 750; cursor: pointer; }
    button:focus-visible { outline: 4px solid rgba(114, 71, 255, .24); outline-offset: 3px; }
    .error { margin: 0 0 18px; padding: 12px 14px; border-radius: 14px; background: #fff1f2; color: #a52d37; font-size: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">POPi</div>
    <h1>进入测试环境</h1>
    <p class="hint">登录后即可开始创作，与助理协作。</p>
    {{ERROR_MESSAGE}}
    <form action="/login" method="post">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" value="popi" autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false" required>
      <label for="password">密码</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" required autofocus>
        <button id="password-toggle" class="password-toggle" type="button" aria-controls="password" aria-pressed="false" aria-label="显示密码">显示</button>
      </div>
      <p class="password-help">密码区分大小写，不含空格。</p>
      <button class="submit" type="submit">登录</button>
    </form>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
