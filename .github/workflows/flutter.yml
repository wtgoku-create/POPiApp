name: Flutter CI and Android Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      ios_action:
        description: iOS action
        required: true
        default: build
        type: choice
        options:
          - build
          - testflight

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: popi-app-android-apk-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build Signed iOS App
    needs: verify
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    env:
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: pod install --repo-update
        working-directory: ios

      - name: Configure iOS Bundle ID
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          content = project.read_text()
          bundle_id = os.environ['IOS_BUNDLE_ID']
          content = content.replace('com.example.flutterStarter', bundle_id)
          project.write_text(content)
          PY

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" -o "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print:UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print:Name' "$RUNNER_TEMP/profile.plist")
          profile_team_id=$(/usr/libexec/PlistBuddy -c 'Print:TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          profile_app_id=$(/usr/libexec/PlistBuddy -c 'Print:Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          profile_bundle_id="${profile_app_id#*.}"
          if [[ "$profile_bundle_id" != "$IOS_BUNDLE_ID" ]]; then
            echo "Provisioning profile Bundle ID ($profile_bundle_id) does not match IOS_BUNDLE_ID ($IOS_BUNDLE_ID)."
            exit 1
          fi
          if [[ "$profile_team_id" != "$IOS_TEAM_ID" ]]; then
            echo "Provisioning profile Team ID does not match IOS_TEAM_ID."
            exit 1
          fi
          cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"
          printf 'IOS_RESOLVED_PROFILE_NAME=%s\n' "$profile_name" >> "$GITHUB_ENV"

      - name: Configure manual distribution signing
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          content = project.read_text()
          bundle_id = os.environ['IOS_BUNDLE_ID']
          team_id = os.environ['IOS_TEAM_ID']
          profile_name = os.environ['IOS_RESOLVED_PROFILE_NAME']

          # The Runner target has three configurations. Apply distribution
          # signing to each one while leaving the test target untouched.
          marker = f'PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};'
          replacement = (
              f'{marker}\n'
              '                CODE_SIGN_STYLE = Manual;\n'
              '                CODE_SIGN_IDENTITY = "Apple Distribution";\n'
              f'                DEVELOPMENT_TEAM = {team_id};\n'
              f'                PROVISIONING_PROFILE_SPECIFIER = "{profile_name}";'
          )
          if content.count(marker) < 1:
              raise SystemExit('Runner bundle identifier setting was not found.')
          content = content.replace(marker, replacement)
          project.write_text(content)
          PY

      - name: Verify Apple distribution signing identity
        run: |
          security find-identity -v -p codesigning | grep -E 'Distribution|iPhone Distribution' || {
            echo 'Apple distribution certificate was not imported.'
            exit 1
          }

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${IOS_RESOLVED_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build signed iOS IPA
        run: flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Resolve generated IPA path
        run: |
          ipa_path=$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          if [[ -z "$ipa_path" ]]; then
            echo 'No IPA file was generated.'
            exit 1
          fi
          echo "IOS_IPA_PATH=$ipa_path" >> "$GITHUB_ENV"
          echo "Generated IPA: $ipa_path"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-starter-ios-signed
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

  upload-ios-testflight:
    name: Upload iOS App to TestFlight
    needs: build-ios
    if: >-
      needs.build-ios.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.ios_action == 'testflight')
      )
    runs-on: macos-latest

    steps:
      - name: Download signed IPA
        uses: actions/download-artifact@v4
        with:
          name: flutter-starter-ios-signed
          path: build/ios/ipa

      - name: Resolve downloaded IPA path
        run: |
          ipa_path=$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          if [[ -z "$ipa_path" ]]; then
            echo 'No IPA artifact was downloaded.'
            exit 1
          fi
          echo "IOS_IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Upload build to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ env.IOS_IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
