name: Flutter Analyze and Test

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: dart run tool/flutter_env.dart development test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ github.run_id }}
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build APK
    needs: verify
    if: github.ref == 'refs/heads/dev-mockui' || github.head_ref == 'dev-mockui' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK with debug signing
        run: dart run tool/flutter_env.dart development build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: popi-android-apk-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios-simulator:
    name: Build iOS Simulator
    needs: verify
    if: github.ref == 'refs/heads/dev-mockui' || github.head_ref == 'dev-mockui' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Simulator
        run: dart run tool/flutter_env.dart development build ios --simulator

      - name: Package simulator app
        run: tar -czf build/popi-ios-simulator.tar.gz -C build/ios/iphonesimulator Runner.app

      - name: Upload iOS Simulator
        uses: actions/upload-artifact@v4
        with:
          name: popi-ios-simulator-${{ github.run_id }}
          path: build/popi-ios-simulator.tar.gz
          if-no-files-found: error
